<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Inventory Utility</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand">
                Product Inventory Utility
            </span>

        </div>

    </nav>


    <main class="container py-4">


        <h1>
            Product Inventory
        </h1>
        <div class="row mb-4">


    <!-- Total Inventory Value -->

    <div class="col-12 col-md-6 mb-3">

        <div class="card h-100">

            <div class="card-body">

                <h5 class="card-title">
                    Total Inventory Value
                </h5>


                <p
                    id="totalInventoryValue"
                    class="card-text fs-3"
                >
                    OMR 0.000
                </p>

            </div>

        </div>

    </div>



    <!-- Low Stock Count -->

    <div class="col-12 col-md-6 mb-3">

        <div class="card h-100">

            <div class="card-body">

                <h5 class="card-title">
                    Low Stock Products
                </h5>


                <p
                    id="lowStockCount"
                    class="card-text fs-3"
                >
                    0
                </p>

            </div>

        </div>

    </div>

</div>
<div class="d-flex justify-content-between align-items-center mb-3">

    <h2 class="mb-0">
        Products
    </h2>


    <button
        type="button"
        id="lowStockBtn"
        class="btn btn-outline-primary"
    >
        Show Low Stock Only
    </button>

</div>
<div
    id="productList"
    class="row"
>
</div>

    </main>


    <script src="inventory.js"></script>


</body>

</html>
