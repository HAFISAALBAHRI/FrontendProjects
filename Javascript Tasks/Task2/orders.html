<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Analytics Dashboard</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="bg-dark text-white py-4">

        <div class="container">

            <h1>
                Order Analytics Dashboard
            </h1>

            <p class="mb-0">
                Day 5 - Arrays, Objects and Array Methods
            </p>

        </div>

    </header>



    <main class="container my-5">


        <!-- ==========================================
             DASHBOARD SUMMARY
        =========================================== -->

        <section class="mb-5">

            <h2 class="mb-4">
                Dashboard Summary
            </h2>


            <div class="row g-3">


                <div class="col-md-3">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h5>
                                Total Revenue
                            </h5>

                            <h3 id="totalRevenue">
                                0.000 OMR
                            </h3>

                        </div>

                    </div>

                </div>


                <div class="col-md-3">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h5>
                                Pending
                            </h5>

                            <h3 id="pendingCount">
                                0
                            </h3>

                        </div>

                    </div>

                </div>


                <div class="col-md-3">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h5>
                                Shipped
                            </h5>

                            <h3 id="shippedCount">
                                0
                            </h3>

                        </div>

                    </div>

                </div>


                <div class="col-md-3">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h5>
                                Cancelled
                            </h5>

                            <h3 id="cancelledCount">
                                0
                            </h3>

                        </div>

                    </div>

                </div>


            </div>


            <div class="card mt-3 shadow-sm">

                <div class="card-body">

                    <p>

                        <strong>
                            Highest Value Order:
                        </strong>

                        <span id="highestOrder">
                            -
                        </span>

                    </p>


                    <p class="mb-0">

                        <strong>
                            Every order has at least one item:
                        </strong>

                        <span id="allHaveItems">
                            -
                        </span>

                    </p>

                </div>

            </div>

        </section>



        <!-- ==========================================
             TOP CUSTOMERS
        =========================================== -->

        <section class="mb-5">

            <div class="row g-4">


                <div class="col-md-6">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h3>
                                Top 3 Orders
                            </h3>

                            <div id="topOrders">
                            </div>

                        </div>

                    </div>

                </div>


                <div class="col-md-6">

                    <div class="card h-100 shadow-sm">

                        <div class="card-body">

                            <h3>
                                Customers Over 150 OMR
                            </h3>

                            <div id="uniqueCustomers">
                            </div>

                        </div>

                    </div>

                </div>


            </div>

        </section>



        <!-- ==========================================
             FILTERING & SEARCH
        =========================================== -->

        <section class="mb-4">

            <h2>
                Orders
            </h2>


            <div class="row g-3 mt-2">


                <div class="col-md-4">

                    <label
                        for="statusFilter"
                        class="form-label"
                    >
                        Filter by Status
                    </label>


                    <select
                        id="statusFilter"
                        class="form-select"
                    >

                        <option value="All">
                            All Orders
                        </option>

                        <option value="Pending">
                            Pending
                        </option>

                        <option value="Shipped">
                            Shipped
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>



                <div class="col-md-4">

                    <label
                        for="searchInput"
                        class="form-label"
                    >
                        Search Customer
                    </label>


                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Enter customer name"
                    >

                </div>



                <div class="col-md-4">

                    <label class="form-label">
                        Discount Preview
                    </label>


                    <div class="form-check form-switch mt-2">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="discountToggle"
                        >


                        <label
                            class="form-check-label"
                            for="discountToggle"
                        >
                            Preview 15% Off Everything
                        </label>

                    </div>

                </div>


            </div>

        </section>



        <!-- ==========================================
             ORDER CARDS
        =========================================== -->

        <section>

            <div
                id="orderList"
                class="row g-4"
            >
            </div>

        </section>


    </main>



    <script src="orders.js"></script>


</body>

</html>
