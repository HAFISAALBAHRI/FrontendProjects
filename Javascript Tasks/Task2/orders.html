<!-- ==========================================
     FILTERING & SEARCH
=========================================== -->

<div class="row mb-4">

    <div class="col-md-6">

        <label for="statusFilter" class="form-label">
            Filter by Status
        </label>

        <select id="statusFilter" class="form-select">

            <option value="All">
                All Orders
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Shipped">
                Shipped
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>

    </div>


    <div class="col-md-6">

        <label for="searchInput" class="form-label">
            Search Customer
        </label>

        <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Enter customer name"
        >

    </div>

</div>
