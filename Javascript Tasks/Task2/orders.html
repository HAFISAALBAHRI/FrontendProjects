<!-- ==========================================
     FILTERING & SEARCH
=========================================== -->

<div class="row mb-4">

    <div class="col-md-6">

        <label for="statusFilter" class="form-label">
            Filter by Status
        </label>

        <select id="statusFilter" class="form-select">

            <option value="All">
                All Orders
            </option>

            <option value="Pending">
                Pending
            </option>

            <option value="Shipped">
                Shipped
            </option>

            <option value="Cancelled">
                Cancelled
            </option>

        </select>

    </div>


    <div class="col-md-6">

        <label for="searchInput" class="form-label">
            Search Customer
        </label>

        <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Enter customer name"
        >

    </div>

</div>
<!-- ==========================================
     DISCOUNT PREVIEW
=========================================== -->

<div class="form-check form-switch mb-4">

    <input
        class="form-check-input"
        type="checkbox"
        id="discountToggle"
    >

    <label
        class="form-check-label"
        for="discountToggle"
    >
        Preview 15% Off Everything
    </label>

</div>

<!-- ==========================================
     ORDER LIST
=========================================== -->

<div
    id="orderList"
    class="row g-4"
>
</div>
